spring:
  application:
    name: contracts-pricing-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contracts}
    username: ${DB_USER:contracts}
    password: ${DB_PASSWORD:contracts}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# Perfil local: base de datos H2 en memoria para probar sin instalar PostgreSQL
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:contracts;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  h2:
    console:
      enabled: true
